# NUCLEO-G431KB (on-board ST-LINK V3E)
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
source [find target/stm32g4x.cfg]

# Connect under reset: hold NRST while attaching, so the debugger can grab
# the core even if firmware disabled SWD pins or sits in low-power mode.
reset_config srst_only srst_nogate connect_assert_srst
